<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative, not absolute: this app has already been broken once by a
         repository rename invalidating every "/…" path in the build. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- viewport-fit=cover so the app reaches under the iPhone's rounded
         corners once installed; the shell already pads for safe areas.

         interactive-widget=resizes-content makes Android Chrome shrink the
         *layout* viewport when the keyboard opens, so `dvh` and fixed
         positioning both account for it. Its default, resizes-visual, leaves
         the layout viewport at full height and hides the bottom of every
         dialog behind the keyboard. iOS ignores this entirely, which is what
         `--vvh` in lib/viewport.ts is for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The colours the app actually paints, read off `body` rather than
         guessed: warm paper and blue-black, not white and grey. These tint the
         status bar of an installed app, so a value that merely looks close
         leaves a visible seam across the top of the screen. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06080e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inkwell" />
    <meta
      name="description"
      content="Inkwell — a calm, local-first novel-writing studio: manuscript editor, worldbuilding almanac, character cards, and cover design."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Async on purpose: a render-blocking stylesheet makes first paint
      hostage to Google's servers, and a writer on a slow or Google-blocked
      network was staring at a white page for the connection timeout —
      measured at 13 seconds. media="print" lets the browser fetch it
      without blocking; onload promotes it, and text renders in fallback
      faces until then (display=swap finishes the job).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Inkwell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
