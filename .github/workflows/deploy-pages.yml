name: Deploy GitHub Pages (INKWELL)

# INKWELL is the whole site. It shared the root with a second app for a while,
# which is why the assembly step below is explicit about what it copies rather
# than publishing inkwell/dist directly — the 404 page lives outside the Vite
# build and still has to reach the artifact.

on:
  push:
    branches: [main, master]
    paths:
      - 'inkwell/**'
      - '404.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC, with no long-lived secret.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but
# don't queue up more than one pending run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inkwell/package-lock.json

      - name: Install INKWELL dependencies
        working-directory: inkwell
        run: npm ci

      - name: Type-check, lint, and test
        working-directory: inkwell
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build INKWELL
        working-directory: inkwell
        # A project site is served from /<repo>/, so the asset prefix has to
        # carry that segment or every script 404s.
        #
        # The Firebase values come from the committed `.env.production` — a
        # Firebase web config is an address, not a secret (access is enforced
        # by firestore.rules, not by hiding the API key), so it lives in the
        # repository where Vite picks it up on its own. Do NOT export
        # VITE_FIREBASE_* here from repository variables: an unset variable
        # renders as an *empty string*, the env var then exists, and Vite lets
        # real process env shadow .env files — which silently builds the site
        # with cloud accounts switched off.
        env:
          INKWELL_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Assemble the site
        # Copied explicitly rather than by excluding things, so that adding a
        # directory to the repository never silently publishes it.
        run: |
          mkdir -p _site
          cp -r inkwell/dist/. _site/
          # 404.html sits outside the Vite build because GitHub Pages, not the
          # app, is what serves it.
          cp 404.html _site/
          echo "Assembled tree:"
          find _site -maxdepth 2 -not -path '_site/assets/*' | sort

      - name: Verify the site is intact
        # Each of these has a specific failure it prevents, and every one of
        # them is silent otherwise — a blank page or a missing site.
        env:
          EXPECTED: /${{ github.event.repository.name }}/
        run: |
          fail() { echo "::error::$1"; exit 1; }

          grep -q "Inkwell" _site/index.html \
            || fail "The published site is not INKWELL."
          [ -d _site/assets ] || fail "INKWELL's built assets are missing."
          [ -f _site/404.html ] || fail "404.html is missing; mis-cased URLs would not self-correct."

          # Built for the right base. A rename of the repository changes this,
          # which is exactly how the site broke once before.
          if grep -qE '(src|href)="/assets/' _site/index.html; then
            fail "INKWELL references a bare /assets/ — INKWELL_BASE_PATH did not apply."
          fi
          grep -q "$EXPECTED" _site/index.html \
            || fail "INKWELL does not reference $EXPECTED — is the repository name what you expect?"

          echo "Site verified."
          echo "INKWELL asset references:"
          grep -oE '(src|href)="[^"]*"' _site/index.html | head -5

      - name: Report which mode INKWELL built in
        # The check is against the *published bundle*, not the inputs — this
        # is exactly the failure mode that once shipped silently: config
        # present in the repo, absent from the built JavaScript.
        run: |
          PROJECT_ID=$(grep -oP '^VITE_FIREBASE_PROJECT_ID=\K\S+' inkwell/.env.production || true)
          if [ -n "$PROJECT_ID" ] && grep -rql "$PROJECT_ID" _site/assets/; then
            echo "::notice::INKWELL built WITH cloud accounts (project $PROJECT_ID — verified present in the built assets). Confirm ${{ github.repository_owner }}.github.io is on the Firebase authorised domains list, or sign-in will be rejected."
          elif [ -n "$PROJECT_ID" ]; then
            echo "::error::inkwell/.env.production names project $PROJECT_ID but the built assets do not contain it — the Firebase config was dropped at build time."
            exit 1
          else
            echo "::notice::INKWELL built WITHOUT cloud accounts — no Firebase project in inkwell/.env.production. The app is local-first and fully usable; the Account tab will explain that sign-in is unavailable. See inkwell/docs/CLOUD_AUTH_SETUP.md to enable it."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
